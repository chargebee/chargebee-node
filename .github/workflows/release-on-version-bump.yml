name: Release on version bump

# Releases are cut by merging the release PR (generated by cb-sdk-gen) into
# master. That merge is the only signal needed: it carries the version bump and
# the CHANGELOG entry, so this workflow tags the merge commit, publishes a GitHub
# release whose notes are that CHANGELOG entry, and then publishes to NPM.
#
# Nothing happens on a push that does not change the version in package.json, and
# a version that is already tagged is left alone, so re-running this is safe.
on:
  push:
    branches:
      - master
  # Manual runs are for checking what a release would do: they default to a dry
  # run that resolves the version and prints the notes without creating the tag,
  # the release or the NPM publish.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (resolve the version and print the release notes, create nothing)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  detect:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history so the previous commit's package.json and the existing
          # tags are available.
          fetch-depth: 0

      - name: Compare version against the previous commit
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          NEW_VERSION=$(jq -r .version package.json)

          # github.event.before is unusable after a force push (all zeros) or if
          # the commit is gone, so fall back to the first parent.
          PREV="$BEFORE"
          if [ -z "$PREV" ] || [ "$PREV" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$PREV^{commit}" 2>/dev/null; then
            PREV=$(git rev-parse --verify HEAD^ 2>/dev/null || true)
          fi

          OLD_VERSION=""
          if [ -n "$PREV" ]; then
            OLD_VERSION=$(git show "$PREV:package.json" 2>/dev/null | jq -r .version 2>/dev/null || true)
          fi

          echo "previous commit: ${PREV:-<none>}"
          echo "version: ${OLD_VERSION:-<unknown>} -> $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            echo "No version bump in this push; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$(git ls-remote --tags origin "refs/tags/v$NEW_VERSION")" ]; then
            echo "v$NEW_VERSION is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Releasing v$NEW_VERSION."
          echo "release=true" >> "$GITHUB_OUTPUT"

  github-release:
    name: Tag and publish GitHub release
    needs: detect
    if: ${{ needs.detect.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # Creating the tag and the release.
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # The section runs from this version's heading to the next version
          # heading. Any heading whose first word is a version ends it: depth and
          # spacing vary over the file's history ("### v3.30.1 (2026-08-11)" is
          # the norm, older entries use "## v3.0.2 (2024-11-09)"), and treating
          # only "### v" as a boundary would swallow the older entries whole.
          # The version is compared as a whole word, so releasing 3.31.0 cannot
          # pick up a "v3.31.0-beta.1" section.
          awk -v ver="$VERSION" '
            function heading_version(line,   rest) {
              if (line !~ /^##+[[:space:]]*v?[0-9]+\.[0-9]+/) return ""
              rest = line
              sub(/^##+[[:space:]]*/, "", rest)
              sub(/[[:space:]].*$/, "", rest)
              sub(/^v/, "", rest)
              return rest
            }
            {
              line = $0
              sub(/\r$/, "", line)
              this = heading_version(line)
              if (this != "") {
                if (this == ver) { found = 1; print line; next }
                if (found) exit
                next
              }
              if (found) print line
            }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No '### v$VERSION' section found in CHANGELOG.md, so there are no release notes to publish. Fix the changelog on master and re-run this workflow."
            exit 1
          fi

          echo "Release notes:"
          cat /tmp/release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would tag $GITHUB_SHA as v$VERSION and publish the release notes above. Nothing was created."
            exit 0
          fi

          # --target pins the tag to the commit that was pushed rather than to
          # whatever master points at by the time this runs. The tag does not
          # exist yet, so this call creates it.
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file /tmp/release-notes.md

  publish:
    name: Publish to NPM
    needs: [detect, github-release]
    if: ${{ needs.detect.outputs.release == 'true' && inputs.dry_run != true }}
    # Called directly rather than left to the tag push: a tag created with
    # GITHUB_TOKEN does not trigger other workflows, so relying on the push
    # event would silently skip the NPM publish.
    uses: ./.github/workflows/release.yml
    secrets: inherit
